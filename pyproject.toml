[project]
name = "tabmill"
version = "0.1.0"
description = "CLI, templates, and skills for Lamill's portfolio of Chrome MV3 extensions."
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "pyyaml>=6",
    "pydantic>=2.7",
]

[project.scripts]
tabmill = "tabmill.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pyyaml>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cli/tabmill"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
files = ["cli/tabmill", "tests"]
mypy_path = "cli"

[tool.ruff.lint.isort]
known-first-party = ["tabmill"]
