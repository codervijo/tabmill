# Recipe for local-seo-checker — source of truth for the generated extension (ADR-0008).
# Fill every ‹FILL›: `tabmill new` refuses while name / summary / single_purpose are unfilled,
# and release lint blocks on any that remain (D-015). Then: tabmill new local-seo-checker
name: Local SEO Checker
slug: local-seo-checker
version: 0.1.0
summary: Check a local business website for LocalBusiness schema, NAP consistency, location pages and calls to action.
single_purpose: Audit the local SEO basics of the business website page you are on.
template: side-panel
permissions:
  - name: activeTab
    justification: Read the current page only after the user clicks the toolbar button.
  - name: scripting
    justification: Run the audit script in the current tab when the user clicks Audit (allowed by activeTab; no host permissions).
  - name: sidePanel
    justification: Show results in Chrome's side panel, opened from the toolbar button.
optional_permissions: []
dependencies: {}        # runtime npm deps — each needs a DECISIONS.md row first
dev_dependencies: {}
remote_code: false
portfolio_site: ‹FILL›  # Rankmill site doesn't exist yet (TODO.md HUMAN line)
landing_page_url: ""
target_keywords: [local seo checker, local seo audit tool, nap consistency checker]
cta_text: Get a full local SEO audit on Rankmill
cta_url: https://rankmill.example/local-seo-audit  # placeholder (D-015) — blocks release
utm_campaign: local-seo-checker
store_category: Tools  # Productivity › Tools — chromewebstore.google.com/category/extensions/productivity/tools (verified 2026-10-11); confirm in the dashboard at "Add new item"
analytics: false
